[package]
name = "cypherlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Embedded in-memory OpenCypher graph database"

[features]
default = ["parquet"]
# Parquet snapshot codec (ADR-0105).
parquet = ["cypherlite-storage/parquet"]

[dependencies]
cypherlite-parser = { workspace = true }
cypherlite-model = { workspace = true }
cypherlite-core = { workspace = true }
cypherlite-ir = { workspace = true }
cypherlite-front = { workspace = true }
cypherlite-planner = { workspace = true }
cypherlite-executor = { workspace = true }
cypherlite-ontology = { workspace = true }
cypherlite-storage = { workspace = true }
cypherlite-catalog = { workspace = true }
# Script execution (`run_script_wire`) splits with the canonical scanner.
cypherlite-splitter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
tempfile = "3"
crc32fast = { workspace = true }
cypherlite-test-support = { workspace = true, features = ["nested_eval"] }
